<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" fill="#F0F9EC"/>
  <rect x="2" y="2" width="176" height="176" fill="none" stroke="#2F441B" stroke-width="1.1"/>
  <path d="M5.5 5.5H174.5V174.5H5.5ZM9.5 9.5V170.5H170.5V9.5Z" fill="#78AA48" fill-rule="evenodd" stroke="#2F441B" stroke-width="0.6"/>
  <rect x="13" y="13" width="154" height="154" fill="none" stroke="#A3CF72" stroke-width="0.7"/>
  <rect x="16.5" y="16.5" width="147" height="147" fill="none" stroke="#4A6B2E" stroke-width="0.6"/>

  <g id="sec-card-c">
    <!-- Hoffmann Quadratstil stepped corner medallion -->
    <rect x="4" y="4" width="14.5" height="14.5" fill="#F0F9EC" stroke="#2F441B" stroke-width="0.8"/>
    <rect x="6.5" y="6.5" width="9.5" height="9.5" fill="#A3CF72" stroke="#2F441B" stroke-width="0.6"/>
    <rect x="9.3" y="9.3" width="3.9" height="3.9" fill="#4B6E2C"/>
    <!-- Strictly modular 3x Schachbrett squares on 5.5u pitch along both axes -->
    <rect x="21.5" y="5.9" width="3.2" height="3.2" fill="#4B6E2C" stroke="#2F441B" stroke-width="0.4"/>
    <rect x="27" y="5.9" width="3.2" height="3.2" fill="#A3CF72" stroke="#2F441B" stroke-width="0.4"/>
    <rect x="32.5" y="5.9" width="3.2" height="3.2" fill="#4B6E2C" stroke="#2F441B" stroke-width="0.4"/>
    <rect x="5.9" y="21.5" width="3.2" height="3.2" fill="#4B6E2C" stroke="#2F441B" stroke-width="0.4"/>
    <rect x="5.9" y="27" width="3.2" height="3.2" fill="#A3CF72" stroke="#2F441B" stroke-width="0.4"/>
    <rect x="5.9" y="32.5" width="3.2" height="3.2" fill="#4B6E2C" stroke="#2F441B" stroke-width="0.4"/>
    <!-- Orthogonal Otto Wagner stepped corner bracket & 3 Postsparkasse flutes -->
    <path d="M16.5 31.5 H23.5 V23.5 H31.5" fill="none" stroke="#2F441B" stroke-width="0.7"/>
    <rect x="19.2" y="19.2" width="3" height="3" fill="#78AA48" stroke="#2F441B" stroke-width="0.45"/>
    <line x1="26" y1="16.5" x2="26" y2="21" stroke="#4A6B2E" stroke-width="0.55"/>
    <line x1="28.5" y1="16.5" x2="28.5" y2="21" stroke="#4A6B2E" stroke-width="0.55"/>
  </g>
  <use href="#sec-card-c" transform="translate(180 0) scale(-1 1)"/>
  <use href="#sec-card-c" transform="translate(0 180) scale(1 -1)"/>
  <use href="#sec-card-c" transform="translate(180 180) scale(-1 -1)"/>
</svg>